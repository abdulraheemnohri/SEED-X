plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }

// Third-party mobile runtime SDKs are independently switchable. The full debug
// workflow opts into all three supported Android SDK packages below.
def seedxRuntimeSdks = (project.findProperty("seedxRuntimeSdks") ?: "").toString()
    .split(",").collect { it.trim().toLowerCase() }.findAll { !it.isEmpty() }

dependencies {
 implementation "androidx.work:work-runtime:2.10.1"
 // LiteRT-LM 0.16.1 uses Kotlin metadata compatible with the Kotlin 2.2 toolchain.
 implementation "com.google.ai.edge.litertlm:litertlm-android:0.16.1"
 implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
 if (seedxRuntimeSdks.contains("litert")) {
  // LiteRT-LM is always included because its concrete adapter is compiled into the app.
 }
 if (seedxRuntimeSdks.contains("executorch")) {
  implementation "org.pytorch:executorch-android:1.0.0"
 }
 if (seedxRuntimeSdks.contains("onnxruntime")) {
  implementation "com.microsoft.onnxruntime:onnxruntime-android:latest.release"
 }
}
android {
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = "17" }
 namespace "org.seedx.agent"
 compileSdk 35
 defaultConfig {
  applicationId "org.seedx.agent"
  minSdk 31
  targetSdk 35
  versionCode 8
  versionName "0.8.0"
  ndk { abiFilters "arm64-v8a", "x86_64" }
  externalNativeBuild { cmake { cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"; arguments "-DANDROID_STL=c++_shared", "-DSEEDX_ENABLE_LLAMA_CPP=${project.findProperty('seedxLlamaCpp') ?: 'OFF'}" } }
 }
 externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
 buildTypes { debug { applicationIdSuffix ".debug"; debuggable true }; release { minifyEnabled false; debuggable false } }
}
