name: SEED-X Core and Inference CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogs and Android permission boundary
        run: python3 scripts/validate_catalogs.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Write CI diagnostics summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## SEED-X core CI diagnostics"
            echo "- Job result: \`$JOB_STATUS\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Run: $RUN_URL"
            if [ "$JOB_STATUS" = "success" ]; then
              echo "- Core build and test steps completed successfully."
            else
              echo "- One or more build/test steps failed. Open the run link and inspect the first failing step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  llama-backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned llama.cpp backend
        run: cmake -S . -B build-llama -DCMAKE_BUILD_TYPE=Release -DSEEDX_ENABLE_LLAMA_CPP=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
      - name: Build SEED-X with real llama.cpp
        run: cmake --build build-llama --target seed_engine --parallel 2

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seedx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Assemble Android debug APK with embedded llama.cpp
        id: llama_android
        continue-on-error: true
        run: gradle assembleDebug -PseedxLlamaCpp=ON
      - name: Upload llama.cpp-enabled Android APK
        if: steps.llama_android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: seedx-debug-apk-llama
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble release APK and Android App Bundle
        run: gradle assembleRelease bundleRelease
      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seedx-unsigned-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
