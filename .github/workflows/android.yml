name: SEED-X Android Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" --licenses
      - name: Install Android SDK, NDK and CMake
        run: "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug
